name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Unzip
        run: |
          ZIP=$(find . -name "resourcemenu-1.0.1.jar-main.zip" -not -path "./.git/*" | head -n 1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d extracted
      - name: Build
        run: |
          cd "$(dirname "$(find extracted -name gradlew | head -n 1)")"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: resourcemenu-jar
          path: extracted/**/build/libs/*.jar
