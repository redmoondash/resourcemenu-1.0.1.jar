name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Unzip
        run: |
          ZIP=$(find . -name "resourcemenu-1.0.1.jar-main.zip" -not -path "./.git/*" | head -n 1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d extracted
      - name: List files
        run: find extracted -maxdepth 3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build
        run: |
          if [ -f "$(find extracted -name gradlew | head -n 1)" ]; then
            cd "$(dirname "$(find extracted -name gradlew | head -n 1)")"
            chmod +x gradlew
            ./gradlew build
          else
            cd "$(dirname "$(find extracted -name 'build.gradle*' | head -n 1)")"
            gradle build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resourcemenu-jar
          path: extracted/**/build/libs/*.jar
